# The bundled plugin catalog snapshot is a hand-refreshed copy of the published
# catalog. Nothing in the build compares the two, so without this job it can sit
# months behind and the only symptom is an air-gapped install rendering stale
# plugin metadata. Scheduled rather than on push: it depends on a live URL, so a
# failure here means "go run the sync", not "this commit is bad".
name: Plugin catalog drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'pigontech/inkvoice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run sync:catalog --check
